# Mbaysalt 回归测试：推送和 PR 时在 GitHub Actions 上运行 Tests/run_all_tests.m。
# 测试依赖由 ST_Mbaysalt 按 Configurefiles/INSTALL.json 安装，不单独拉取子模块。
name: test

on:
  push:
  pull_request:

jobs:
  matlab:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # R2025b 为 Contents.m 声明的构建版本，latest 为 MathWorks 当前最新版本
        release: [R2025b, latest]
    steps:
      - uses: actions/checkout@v5

      - uses: matlab-actions/setup-matlab@v2
        with:
          release: ${{ matrix.release }}

      - uses: matlab-actions/run-command@v2
        with:
          command: addpath('Tests'); run_all_tests
